name: task2-terraform

on:
  push:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/terraform-task2.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive Task2Advanced

      - name: Terraform init without backend
        run: terraform -chdir=Task2Advanced/root init -backend=false

      - name: Terraform validate
        run: terraform -chdir=Task2Advanced/root validate

  plan:
    name: plan dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    environment: dev

    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id: ${{ secrets.YC_DEV_SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check required configuration
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY YC_TOKEN TF_STATE_BUCKET TF_VAR_cloud_id TF_VAR_folder_id TF_VAR_subnet_id TF_VAR_ssh_public_key; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Terraform init
        run: |
          terraform -chdir=Task2Advanced/root init \
            -backend-config="../backend/dev.tfbackend" \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform plan
        run: |
          terraform -chdir=Task2Advanced/root plan \
            -var-file="../envs/dev/dev.tfvars" \
            -out="dev.tfplan"


  apply:
    name: apply dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: plan
    environment: dev
    concurrency:
      group: task2-dev
      cancel-in-progress: false

    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id: ${{ secrets.YC_DEV_SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check required configuration
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY YC_TOKEN TF_STATE_BUCKET TF_VAR_cloud_id TF_VAR_folder_id TF_VAR_subnet_id TF_VAR_ssh_public_key; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Terraform init
        run: |
          terraform -chdir=Task2Advanced/root init \
            -backend-config="../backend/dev.tfbackend" \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform plan
        run: |
          terraform -chdir=Task2Advanced/root plan \
            -var-file="../envs/dev/dev.tfvars" \
            -out="dev.tfplan"

      - name: Terraform apply
        run: terraform -chdir=Task2Advanced/root apply -auto-approve "dev.tfplan"
